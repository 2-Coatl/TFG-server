[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tfg-codex"
version = "0.1.0"
description = "Herramienta CLI para ejecutar tareas Codex dentro del monolito"
readme = "README.md"
requires-python = ">=3.11"
authors = [
  { name = "Equipo TFG" }
]
dependencies = []

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "ruff>=0.5.0"
]

[project.urls]
Homepage = "https://example.com/tfg-codex"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.coverage.run]
source = ["codex"]
branch = true
